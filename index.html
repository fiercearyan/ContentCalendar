<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Content Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0E0E10;--in:#0F0F11;--panel:#121214;--s1:#131315;--s1b:#151517;--s1h:#17171A;--s2:#18181B;--chip:#1A1A1D;--l3:#1C1C1F;--l2:#1E1E21;--hov:#202024;--line:#222226;--chiph:#232327;--l26:#26262A;--seg:#2A2A2E;--bd:#2C2C30;--bd2:#34332F;--bd3:#3A3936;--bd4:#4A4844;--text:#EDEBE6;--muted:#A29F97;--dim:#6F6C66;--faint:#8C8981;--g:#6EDCA6;--b:#8DC0F8;--r:#F28A8A;--a2:#F5C35E;--hdr:rgba(14,14,16,.88);--wknd:rgba(255,255,255,.012);color-scheme:dark}
:root[data-theme=light]{--bg:#F6F5F2;--in:#FFFFFF;--panel:#FCFBF9;--s1:#FFFFFF;--s1b:#EFEEEA;--s1h:#FAF9F6;--s2:#F4F3EF;--chip:#F5F4F0;--l3:#EFEDE9;--l2:#EAE8E3;--hov:#EAE8E3;--line:#E5E3DD;--chiph:#ECEAE5;--l26:#E0DED8;--seg:#FFFFFF;--bd:#DAD8D1;--bd2:#CFCCC4;--bd3:#BDB9B0;--bd4:#B8B4AB;--text:#1B1A17;--muted:#5F5C55;--dim:#86827A;--faint:#78746C;--g:#1D8352;--b:#2B67B3;--r:#C23C3B;--a2:#9A6400;--hdr:rgba(246,245,242,.86);--wknd:rgba(0,0,0,.015);color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Geist,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;font-size:14px}
a{color:#F5B83D;text-decoration:none}
button,input,textarea,select{font-family:inherit;color:inherit}
button{cursor:pointer;white-space:nowrap}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
::-webkit-scrollbar{height:10px;width:10px}::-webkit-scrollbar-thumb{background:#2A2926;border-radius:10px;border:2px solid var(--bg)}::-webkit-scrollbar-track{background:transparent}
.cap{font-size:11.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.fx{display:flex;align-items:center}.f1{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* header */
header{position:sticky;top:0;z-index:30;background:var(--hdr);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.wrap{max-width:1520px;margin:0 auto;padding-left:28px;padding-right:28px}
.hrow{padding-top:14px;padding-bottom:14px;display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap}
.logo{width:28px;height:28px;border-radius:8px;background:#F5B83D;color:#141210;display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:-.02em}
.seg{display:flex;gap:2px;padding:3px;background:var(--s1b);border:1px solid var(--line);border-radius:10px}
.seg button{border:0;padding:7px 14px;border-radius:7px;font-size:13.5px;font-weight:500;background:transparent;color:var(--muted)}
.seg button.on{background:var(--seg);color:var(--text)}
.seg.sm{padding:2px;border-radius:8px}
.seg.sm button{height:24px;padding:0 10px;border-radius:6px;font-size:12.5px;display:flex;align-items:center;gap:6px}
.btn{height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--bd);background:var(--s2);font-size:13.5px;font-weight:500}
.btn:hover{background:var(--hov)}
.btn.sm{height:32px;font-size:13px;padding:0 12px;border-radius:8px}
.btn.primary{border:0;background:#F5B83D;color:#141210;font-weight:600;display:flex;align-items:center;gap:10px;padding:0 10px 0 14px}
.btn.primary:hover{background:#FFC85A}
.kbd{font-family:'Geist Mono',monospace;font-size:11px;padding:2px 6px;border-radius:5px;background:rgba(20,18,16,.14)}
.iconbtn{width:36px;height:36px;border-radius:9px;border:1px solid var(--bd);background:var(--s2);display:grid;place-items:center;padding:0}
.iconbtn:hover{background:var(--hov)}
.themei{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--text);background:linear-gradient(90deg,var(--text) 50%,transparent 50%)}
.syncdot{width:7px;height:7px;border-radius:50%;margin-right:4px;background:#5BD69A;box-shadow:0 0 0 3px rgba(91,214,154,.15)}
.syncdot.saving{background:#F5B83D;box-shadow:0 0 0 3px rgba(245,184,61,.18)}
.syncdot.bad{background:#F26B6B;box-shadow:0 0 0 3px rgba(242,107,107,.18)}
.syncdot.local{background:var(--bd4);box-shadow:none}
.frow{padding-bottom:12px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.chf{display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:7px;font-size:12.5px;font-weight:500;border:1px solid transparent;background:transparent;color:var(--muted)}
.chf.on{background:var(--line);color:var(--text);border-color:var(--bd2)}
.dot{width:7px;height:7px;border-radius:50%;flex:none;display:inline-block}
.vsep{width:1px;height:18px;background:var(--l26)}
.linkbtn{border:0;background:transparent;color:#F5B83D;font-size:12.5px;padding:0}

main{padding-top:28px;padding-bottom:80px}
h1{margin:0;font-size:26px;font-weight:600;letter-spacing:-.02em}
h2{margin:0;font-size:16px;font-weight:600}
.sub{font-size:13px;color:var(--dim)}
section{display:flex;flex-direction:column;gap:12px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:14px}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px}
.kpi{white-space:normal;text-align:left;border:1px solid var(--line);border-radius:14px;background:var(--s1);padding:18px 20px;display:flex;flex-direction:column;gap:4px}
.kpi:hover{background:var(--s1h)}
.kpi .v{font-size:32px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-top:4px}
.kpi .l{font-size:12.5px;color:var(--muted)}.kpi .s{font-size:12.5px;color:var(--dim)}
.kbar{height:4px;border-radius:2px;background:var(--l26);margin-top:8px;overflow:hidden}.kbar i{display:block;height:100%}

/* badges */
.bdg{font-family:'Geist Mono',monospace;font-size:10.5px;font-weight:500;padding:3px 6px;border-radius:5px;line-height:1;border:1px solid}
.bdg.sm{font-size:9.5px;padding:2px 4px;border-radius:4px}
.bdg.posted{background:rgba(91,214,154,.14);color:var(--g);border-color:rgba(91,214,154,.28)}
.bdg.scheduled{background:rgba(120,180,246,.14);color:var(--b);border-color:rgba(120,180,246,.3)}
.bdg.none{background:transparent;color:var(--faint);border-color:var(--bd2)}
.pill{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:12px;font-weight:500;padding:3px 9px;border-radius:999px}
.pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}

/* attention */
.att{display:grid;grid-template-columns:72px minmax(0,1fr) auto auto;align-items:center;gap:14px;padding:11px 16px;border-bottom:1px solid var(--l2)}
.att:last-child{border-bottom:0}
.att .open{border:0;background:transparent;text-align:left;padding:0;display:flex;align-items:center;gap:10px;min-width:0}
.mini{height:28px;padding:0 10px;border-radius:7px;border:1px solid var(--bd);background:transparent;font-size:12.5px}
.mini.b{color:var(--b)}.mini.b:hover{background:rgba(120,180,246,.1)}
.mini.g{color:var(--g)}.mini.g:hover{background:rgba(91,214,154,.1)}

/* runway */
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);align-items:center;flex-wrap:wrap}
.legend>span{display:flex;gap:6px;align-items:center}
.tl{border:1px solid var(--line);border-radius:14px;overflow-x:auto;background:var(--panel)}
.tlg{display:grid}
.tlh{border-bottom:1px solid var(--line)}
.tlh>div{padding:10px 8px;border-left:1px solid var(--l2);display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.tlh>div:first-child{padding:12px 16px;border-left:0;justify-content:flex-end}
.tlh .dw{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim)}
.tlh .dn{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;padding:1px 6px;margin-left:-6px;border-radius:6px}
.tlh .past .dn{color:var(--dim)}
.tlh .today .dw{color:#F5B83D}.tlh .today .dn{background:#F5B83D;color:#141210}
.tlr{border-bottom:1px solid var(--l2)}.tlr:last-child{border-bottom:0}
.tlr>.lane{padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tlc{border-left:1px solid var(--l2);padding:6px;display:flex;flex-direction:column;gap:6px;min-height:104px}
.tlc.today{background:rgba(245,184,61,.05)}.tlc.wknd{background:var(--wknd)}
.chip{text-align:left;padding:7px 8px;border-radius:8px;background:var(--chip);border:1px solid var(--l26);display:flex;flex-direction:column;gap:6px;white-space:normal}
.chip:hover{background:var(--chiph)}
.chip.idea{background:transparent;border-style:dashed;border-color:var(--bd2)}
.chip.od{border-color:rgba(242,107,107,.55)}
.chip .t{font-size:12px;line-height:1.35;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;max-height:2.7em}
.chip.idea .t{color:var(--dim)}
.chip .m{display:flex;gap:3px;flex-wrap:wrap;align-items:center}
.chip .fm{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin-right:2px}
.addcell{flex:1;min-height:22px;border:1px dashed transparent;border-radius:7px;background:transparent;color:transparent;font-size:16px}
.addcell:hover{border-color:var(--bd2);color:var(--dim)}

/* pipeline */
.pipe{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.pcard{padding:20px;display:flex;flex-direction:column;gap:16px}
.pfmt{display:flex;flex-direction:column;gap:12px;padding-top:16px;border-top:1px solid var(--line)}
.pfmt .h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.pnums{display:flex;gap:12px;font-size:12px}
.pnums button{border:0;background:transparent;padding:0;font:inherit;font-family:'Geist Mono',monospace}
.pnums button:hover{text-decoration:underline}
.prow{display:flex;flex-direction:column;gap:6px}
.pbar{display:flex;gap:2px;height:6px;border-radius:3px;overflow:hidden;background:var(--line)}
.next{text-align:left;border:1px solid var(--line);background:var(--s2);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.next:hover{border-color:var(--bd2)}

/* month */
.mgrid{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel)}
.mrow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--l2)}
.mrow:last-child{border-bottom:0}
.mrow.h{border-bottom:1px solid var(--line)}
.mrow.h>div{padding:10px 12px}
.mday{min-height:132px;padding:8px;border-right:1px solid var(--l2);display:flex;flex-direction:column;gap:4px;min-width:0}
.mday:last-child{border-right:0}
.mday.out{background:var(--bg)}.mday.today{background:rgba(245,184,61,.05)}
.mnum{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;padding:2px 7px;border-radius:6px}
.mday.past .mnum{color:var(--dim)}.mday.out .mnum{color:var(--bd3)}.mday.today .mnum{background:#F5B83D;color:#141210}
.madd{width:22px;height:22px;border-radius:6px;border:0;background:transparent;color:var(--bd4);font-size:15px;line-height:1}
.madd:hover{background:var(--line);color:var(--text)}
.mchip{display:flex;align-items:center;gap:6px;width:100%;min-width:0;padding:5px 7px;border-radius:6px;background:var(--chip);border:1px solid var(--l26);text-align:left;font-size:12px}
.mchip:hover{background:var(--chiph)}
.mchip.idea{background:transparent;border-style:dashed;border-color:var(--bd2)}.mchip.idea .ell{color:var(--dim)}
.mchip.od{border-color:rgba(242,107,107,.55)}
.pdot{width:5px;height:5px;border-radius:50%;display:inline-block}
.pdot.posted{background:#5BD69A}.pdot.scheduled{background:#78B4F6}.pdot.none{background:var(--bd4)}
.more{border:0;background:transparent;text-align:left;padding:2px 7px;font-size:12px;color:var(--muted)}

/* posts */
.pgrid{display:grid;grid-template-columns:110px 170px minmax(0,1fr) 70px 130px 120px;gap:16px;align-items:center}
.phead{padding:10px 16px;border-bottom:1px solid var(--line)}
.prowb{width:100%;text-align:left;border:0;border-top:1px solid var(--l3);background:transparent;padding:11px 16px;font-size:13.5px}
.prowb:hover{background:var(--s2)}
.ghead{display:flex;align-items:center;gap:8px;padding:14px 16px 8px;font-size:12px;font-weight:600}
.search{width:320px;max-width:100%;height:36px;padding:0 12px;border-radius:9px;border:1px solid var(--bd);background:var(--s1b);font-size:13.5px;outline:none}

/* settings */
.sinput{height:38px;padding:0 12px;border-radius:9px;border:1px solid var(--bd);background:var(--in);color:var(--text);font-size:14px;outline:none;width:100%}
.slabel{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--dim)}
.sw{width:24px;height:24px;border-radius:7px;border:2px solid transparent;padding:0}
.sw.on{border-color:var(--text)}
.sfmt{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:center;padding:12px 0;border-bottom:1px solid var(--l3)}
.tog{width:34px;height:20px;border-radius:10px;border:0;padding:2px;background:var(--bd2);display:flex;justify-content:flex-start}
.tog.on{background:#F5B83D;justify-content:flex-end}
.tog span{width:16px;height:16px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.opt{height:28px;border-radius:7px;font-size:12px;font-weight:500;border:1px solid var(--bd);background:transparent;color:var(--dim)}
.opt.on{background:rgba(245,184,61,.14);color:var(--a2);border-color:rgba(245,184,61,.4)}
.opt.day{width:32px}.opt.pl{padding:0 10px;font-family:'Geist Mono',monospace;font-size:11.5px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(5,5,6,.55);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100vw);background:var(--s1);border-left:1px solid var(--l26);z-index:41;display:flex;flex-direction:column;box-shadow:-24px 0 60px rgba(0,0,0,.4)}
.dhead{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.dbody{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:22px}
.dfoot{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--line)}
.dtitle{width:100%;border:0;border-bottom:1px solid var(--l26);background:transparent;font-size:22px;font-weight:600;letter-spacing:-.02em;outline:none;padding:0 0 12px}
.dfield{display:flex;flex-direction:column;gap:8px}
.chopt{display:flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:500;border:1px solid var(--bd);background:transparent;color:var(--muted)}
.chopt.on{background:var(--line);color:var(--text);border-color:var(--bd3)}
.dinput{height:36px;padding:0 10px;border-radius:8px;border:1px solid var(--bd);background:var(--in);color:var(--text);font-size:13.5px;outline:none}
.iseg{display:flex;gap:2px;padding:2px;background:var(--in);border:1px solid var(--bd);border-radius:8px}
.iseg button{flex:1;border:0;border-radius:6px;font-size:13px;font-weight:500;background:transparent;color:var(--dim)}
.iseg button.on{background:var(--seg);color:var(--text)}
.iseg button.on.scheduled{background:rgba(120,180,246,.14);color:var(--b)}
.iseg button.on.posted{background:rgba(91,214,154,.14);color:var(--g)}
.platrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--l3);min-height:52px}
.platrow:last-child{border-bottom:0}
.x{width:26px;height:26px;border:0;border-radius:6px;background:transparent;color:var(--dim);font-size:15px}
.x:hover{background:var(--line);color:var(--text)}
.addp{border:1px dashed var(--bd2);background:transparent;border-radius:7px;height:28px;padding:0 10px;font-size:12.5px;color:var(--muted)}
.addp:hover{color:var(--text);border-color:var(--bd4)}
.dtext{width:100%;resize:vertical;padding:10px 12px;border-radius:9px;border:1px solid var(--bd);background:var(--in);color:var(--text);font-size:13.5px;line-height:1.5;outline:none}
.danger{height:36px;padding:0 12px;border-radius:9px;border:0;background:transparent;color:var(--r);font-size:13px}
.danger:hover{background:rgba(242,107,107,.1)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:60;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13.5px;font-weight:500;box-shadow:0 12px 40px rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.lock{position:fixed;inset:0;z-index:70;background:var(--bg);display:none;place-items:center;padding:20px}
.lock.open{display:grid}
.lock form{width:min(380px,100%);padding:28px;display:flex;flex-direction:column;gap:14px}

@media (max-width:760px){
  header{position:static}
  .wrap{padding-left:14px;padding-right:14px}
  .pgrid{grid-template-columns:90px minmax(0,1fr) 110px}
  .pgrid>.hm{display:none}
  .att{grid-template-columns:60px minmax(0,1fr)}
  .att>.bd,.att>.ac{grid-column:2}
  .mday{min-height:84px;padding:4px}.mchip .ell,.mchip .pds{display:none}
}
</style>
</head>
<body>
<header>
  <div class="wrap hrow">
    <div class="fx" style="gap:10px;flex:none">
      <div class="logo">CC</div>
      <div style="font-weight:600;font-size:15px;letter-spacing:-.01em;white-space:nowrap">Content Calendar</div>
    </div>
    <nav class="seg" id="nav"></nav>
    <div class="f1"></div>
    <div class="fx" style="gap:10px;flex:none">
      <span class="syncdot" id="sync" title="Saved"></span>
      <button class="iconbtn" data-act="theme" id="themeBtn" title="Switch theme"><span class="themei"></span></button>
      <button class="btn" data-act="plan" title="Add idea slots on posting days for the next 2 weeks">Plan 2 weeks</button>
      <button class="btn primary" data-act="new">New post <span class="kbd">N</span></button>
    </div>
  </div>
  <div class="wrap frow" id="filters"></div>
</header>

<main class="wrap" id="main"></main>
<div id="drawerHost"></div>
<div class="toast" id="toast"></div>

<div class="lock" id="lock">
  <form class="card" id="lockForm">
    <div class="fx" style="gap:10px"><div class="logo">CC</div><div style="font-weight:600;font-size:15px">Content Calendar</div></div>
    <div style="font-size:13.5px;color:var(--muted)">Enter the passcode to load and sync your calendar. You only need to do this once per device.</div>
    <input type="password" id="lockIn" class="sinput" placeholder="Passcode" autocomplete="current-password" />
    <div id="lockErr" style="color:var(--r);font-size:12.5px;min-height:16px"></div>
    <button class="btn primary" style="justify-content:center;padding:0 14px">Unlock</button>
  </form>
</div>

<script>
(() => {
  'use strict';

  // ================= constants =================
  const KEY = 'contentCalendar.v1';
  const UIK = 'contentCalendar.ui';
  const PL = ['ig', 'yt', 'fb'];
  const PLN = { ig: 'IG', yt: 'YT', fb: 'FB' };
  const PLF = { ig: 'Instagram', yt: 'YouTube', fb: 'Facebook' };
  const FMTS = ['short', 'long'];
  const FL = { short: { ig: 'Instagram · Reels', yt: 'YouTube · Shorts', fb: 'Facebook · Reels' }, long: { ig: 'Instagram · Video', yt: 'YouTube · Full length', fb: 'Facebook · Video' } };
  const DOW = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  const MON = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const SW = ['#4CC2F0', '#F59A4A', '#A98BFA', '#5BD69A', '#F07A9A', '#E8C547'];
  const OLD_COLORS = { '#38bdf8': '#4CC2F0', '#fb923c': '#F59A4A', '#a78bfa': '#A98BFA' };

  const DEFAULT_CHANNELS = [
    { id: 'td', name: 'Tech Decoded', color: '#4CC2F0', handles: 'IG @techdecoded49 · YouTube',
      formats: { short: { platforms: ['ig', 'yt'], days: [] } }, m1: true, m2: true, m3: true },
    { id: 'sos', name: 'Secrets of Sanatan', color: '#F59A4A', handles: 'IG @mewwwssss · YouTube',
      formats: { short: { platforms: ['yt'], days: [] }, long: { platforms: ['yt'], days: [] } }, m1: true, m2: true, m3: true },
    { id: 'ttr', name: 'The Thinking Room', color: '#A98BFA', handles: 'IG @thethinkingroom.in · YouTube · Facebook',

  ];

  // ================= dates (local YYYY-MM-DD, no timezone drift) =================
  const pad = n => String(n).padStart(2, '0');
  const ds = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const pd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const add = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return ds(d); };
  const dowi = s => (pd(s).getDay() + 6) % 7;            // Monday = 0
  const nice = s => { const d = pd(s); return `${DOW[dowi(s)]} ${d.getDate()} ${MON[d.getMonth()].slice(0, 3)}`; };
  let TODAY = ds(new Date());

  // ================= data =================

  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} // keep any one-time settings update
  const ui = loadUI();

  function load() {
    try {
      const raw = localStorage.getItem(KEY);

  }
  function loadUI() {

    try { const s = JSON.parse(localStorage.getItem(UIK) || '{}'); ['view', 'cf', 'pf', 'sf', 'theme'].forEach(k => { if (s[k]) d[k] = s[k]; }); } catch (e) {}

  }
  function saveUI() { try { localStorage.setItem(UIK, JSON.stringify({ view: ui.view, cf: ui.cf, pf: ui.pf, sf: ui.sf, theme: ui.theme })); } catch (e) {} }

  function fixState(s) {
    if (!Array.isArray(s.channels) || !s.channels.length) {
      s.channels = structuredClone(DEFAULT_CHANNELS);
      // existing posts: let the one-time updates below run on them; a brand-new device keeps the flags so it can't override synced settings
      if ((s.items || []).length) s.channels.forEach(c => { delete c.m1; delete c.m2; delete c.m3; });
    }
    s.deleted = s.deleted || {};
    const now = Date.now();
    s.channels.forEach(c => {
      if (c.m2) return;
      (s.items || []).forEach(i => {
        if (i.channel === c.id && /scheduled on YouTube/.test(i.notes || '') && i.platforms.yt && !i.platforms.yt.posted && !i.platforms.yt.scheduled) {

    });

      c.m3 = true; s.channelsAt = now;
    });

    s.items.forEach(i => {
      i.updatedAt = i.updatedAt || 1;

  }
  function persist() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { toast('Could not save in this browser — export a backup'); } }
  function save() { persist(); schedulePush(); }
  const touch = it => { it.updatedAt = Date.now(); it.stage = overall(it) === 'posted' ? 'Posted' : ((it.title || '').trim() ? 'Ready' : 'Idea'); return it; };
  const tombstone = id => { state.deleted[id] = Date.now(); };

  // Merge two states post-by-post (newest edit wins). Keep in step with merge() in api/data.js.
  function merge(a, b) {
    if (!a) return b;
    if (!b) return a;

    Object.entries(b.deleted || {}).forEach(([id, t]) => { deleted[id] = Math.max(deleted[id] || 0, t); });
    const byId = {};
    [...(a.items || []), ...(b.items || [])].forEach(it => {
      const cur = byId[it.id];
      if (!cur || (it.updatedAt || 0) > (cur.updatedAt || 0)) byId[it.id] = it;

  // ================= cloud sync (Vercel function + Upstash Redis) =================
  const PASSK = 'contentCalendar.pass';

  let pushT, syncing = false, dirty = false;
  function setSync(cls, tip) { const el = document.getElementById('sync'); el.className = 'syncdot ' + cls; el.title = tip; }
  async function api(method, body) {
    const r = await fetch('/api/data', { method, headers: { 'x-passcode': pass, 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw Object.assign(new Error(j.error || `HTTP ${r.status}`), { code: r.status });

  function schedulePush() {

  async function push() {

  }
  function needsPush(server, local) {

  function lockOut(msg) {

  // ================= post helpers =================

  const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);

  const pst = (p, k) => p.platforms[k]?.posted ? 'posted' : p.platforms[k]?.scheduled ? 'scheduled' : 'none';

  // ================= actions =================

    else if (ui.view === 'posts') m.innerHTML = viewPosts();

  }

  function renderFilters() {

      `<button class="chf ${ui.cf === c.id ? 'on' : ''}" data-act="cf" data-v="${c.id}">${c.color ? `<span class="dot" style="background:${c.color}"></span>` : ''}${esc(c.name)}</button>`).join('');

  function viewDash() {

      `<div class="${d === TODAY ? 'today' : d < TODAY ? 'past' : ''}" style="${d === TODAY ? 'background:rgba(245,184,61,.05)' : dowi(d) > 4 ? 'background:var(--wknd)' : ''}"><span class="dw">${DOW[dowi(d)]}</span><span class="dn">${pd(d).getDate()}</span></div>`).join('')}</div>`;

      const formats = FMTS.map(f => {
        const L = P.filter(p => p.channel === c.id && p.format === f && !isIdea(p));
        if (!L.length) return '';
        const cnt = x => L.filter(p => overall(p) === x).length;
        const prows = PL.filter(k => L.some(p => has(p, k))).map(k => {
          const E = L.filter(p => has(p, k)), pp = E.filter(p => pst(p, k) === 'posted').length, ss = E.filter(p => pst(p, k) === 'scheduled').length;
          return `<div class="prow"><div class="fx" style="justify-content:space-between;font-size:12.5px"><span style="color:var(--muted)">${FL[f][k]}</span><span class="mono" style="color:var(--dim)">${pp}/${E.length}${ss ? ` <span style="color:var(--b)">+${ss} sched</span>` : ''}</span></div>
            <div class="pbar"><div style="width:${E.length ? pp / E.length * 100 : 0}%;background:#5BD69A"></div><div style="width:${E.length ? ss / E.length * 100 : 0}%;background:#78B4F6"></div></div></div>`;
        }).join('');
        return `<div class="pfmt"><div class="h"><div style="font-size:13.5px;font-weight:600">${f === 'short' ? 'Shorts &amp; Reels' : 'Full videos'} <span style="color:var(--dim);font-weight:400">· ${L.length} made</span></div>
          <div class="pnums"><button style="color:var(--g)" data-act="jump" data-c="${c.id}" data-s="posted">${cnt('posted')} posted</button><button style="color:var(--b)" data-act="jump" data-c="${c.id}" data-s="scheduled">${cnt('scheduled')} sched</button><button style="color:var(--a2)" data-act="jump" data-c="${c.id}" data-s="none">${cnt('none')} to schedule</button></div></div>${prows}</div>`;
      }).join('');
      const nx = P.filter(p => p.channel === c.id && p.date >= TODAY && overall(p) !== 'posted').sort(byDate)[0];
      return `<div class="card pcard">
        <div class="fx" style="gap:10px"><span style="width:10px;height:10px;border-radius:3px;background:${c.color};flex:none"></span><div style="display:flex;flex-direction:column;gap:2px;min-width:0"><span style="font-weight:600;font-size:15px">${esc(c.name)}</span><span class="ell" style="font-size:12.5px;color:var(--dim)">${esc(c.handles || '')}</span></div></div>
        ${formats || '<div class="sub">Nothing made yet.</div>'}
        <div class="f1"></div>
        ${nx ? `<button class="next" data-act="open" data-id="${nx.id}"><span class="cap" style="font-size:11px">Next up · ${nx.date === TODAY ? 'Today' : nice(nx.date)}</span><span class="ell" style="font-size:13px;font-weight:500;max-width:100%">${esc(title(nx))}</span></button>` : ''}
      </div>`;
    }).join('');

    return `<div style="display:flex;flex-direction:column;gap:32px">
      <div><div class="mono cap" style="font-size:12px">${['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'][td.getDay()]}, ${td.getDate()} ${MON[td.getMonth()]}</div>
        <h1 style="margin-top:6px;font-size:30px;letter-spacing:-.025em;text-wrap:balance">${today.length} post${today.length === 1 ? '' : 's'} due today${ods.length ? `, ${ods.length} overdue.` : '. Nothing overdue.'}</h1></div>
      <div class="kpis">${kpis}</div>
      ${attHTML}
      <section>
        <div class="fx" style="align-items:baseline;gap:10px;flex-wrap:wrap"><h2>Runway</h2><span class="sub" style="white-space:nowrap">${nice(days[0])} – ${nice(days[N - 1])}</span><div class="f1"></div>
          <div class="legend"><span><span class="bdg posted sm">IG</span>posted</span><span><span class="bdg scheduled sm">IG</span>scheduled</span><span><span class="bdg none sm">IG</span>to schedule</span><span><span style="width:12px;height:12px;border-radius:3px;border:1px solid rgba(242,107,107,.6)"></span>overdue</span></div></div>
        <div class="tl"><div style="min-width:${180 + N * 100}px">${head}${rows}</div></div>
      </section>
      <section>
        <div class="fx" style="align-items:baseline;gap:10px;flex-wrap:wrap"><h2>Pipeline by channel</h2><span class="sub">Made → scheduled → posted, per platform. Tap a number to see those posts.</span></div>
        <div class="pipe">${pipe}</div>
      </section>
    </div>`;
  }

  function viewMonth() {
    const V = state.items.filter(vis), [y, m] = ui.month.split('-').map(Number), first = ui.month + '-01';
    let cur = add(first, -dowi(first)); const weeks = [];
    while (weeks.length < 6) { const w = []; for (let i = 0; i < 7; i++) { w.push(cur); cur = add(cur, 1); } weeks.push(w); if (cur.slice(0, 7) !== ui.month) break; }
    const body = weeks.map(w => `<div class="mrow">${w.map(d => {
      const inM = d.slice(0, 7) === ui.month, L = V.filter(p => p.date === d).sort(byDate), ex = ui.expand === d, show = ex ? L : L.slice(0, 3);
      const cls = ['mday', !inM ? 'out' : '', d === TODAY ? 'today' : '', d < TODAY ? 'past' : ''].join(' ');
      return `<div class="${cls}">
        <div class="fx" style="justify-content:space-between;margin-bottom:2px"><span class="mnum">${pd(d).getDate()}</span><button class="madd" data-act="new-at" data-d="${d}" title="Add a post">+</button></div>
        ${show.map(p => { const c = chan(p.channel);
          return `<button class="mchip ${isIdea(p) ? 'idea' : ''} ${od(p) ? 'od' : ''}" data-act="open" data-id="${p.id}" title="${esc(title(p))}"><span class="dot" style="width:6px;height:6px;background:${c.color}"></span><span class="f1 ell">${esc(title(p))}</span><span class="fx pds" style="gap:2px;flex:none">${plats(p).map(k => `<span class="pdot ${pst(p, k)}"></span>`).join('')}</span></button>`; }).join('')}
        ${L.length > 3 ? `<button class="more" data-act="more" data-d="${d}">${ex ? 'Show less' : `+${L.length - 3} more`}</button>` : ''}
      </div>`;
    }).join('')}</div>`).join('');
    return `<div style="display:flex;flex-direction:column;gap:16px">
      <div class="fx" style="gap:10px;flex-wrap:wrap">
        <h1 style="min-width:220px">${MON[m - 1]} ${y}</h1>
        <button class="btn sm" style="width:32px;padding:0" data-act="m-prev">‹</button>
        <button class="btn sm" style="width:32px;padding:0" data-act="m-next">›</button>
        <button class="btn sm" data-act="m-today">Today</button>
        <div class="f1"></div>
        <span class="legend" style="font-size:12.5px"><span><span class="pdot posted" style="width:6px;height:6px"></span>posted</span><span><span class="pdot scheduled" style="width:6px;height:6px"></span>scheduled</span><span><span class="pdot none" style="width:6px;height:6px"></span>to schedule</span></span>
      </div>
      <div class="mgrid"><div class="mrow h">${DOW.map(d => `<div class="cap">${d}</div>`).join('')}</div>${body}</div>
    </div>`;
  }

  function viewPosts() {
    const q = ui.q.trim().toLowerCase();
    const L = state.items.filter(vis).filter(p => !q || ((p.title || '') + ' ' + (p.notes || '')).toLowerCase().includes(q));
    const asc = byDate, desc = (a, b) => byDate(b, a);
    const G = [['Overdue', 'var(--r)', L.filter(od).sort(asc)], ['Today', 'var(--a2)', L.filter(p => p.date === TODAY && !od(p))], ['Upcoming', 'var(--text)', L.filter(p => p.date > TODAY).sort(asc)], ['Earlier', 'var(--muted)', L.filter(p => p.date < TODAY && !od(p)).sort(desc)]];
    const groups = G.filter(g => g[2].length).map(([label, color, rows]) => `<div>
      <div class="ghead" style="color:${color}">${label}<span class="mono" style="font-weight:400;color:var(--dim)">${rows.length}</span></div>
      ${rows.map(p => { const c = chan(p.channel);
        return `<button class="prowb pgrid" data-act="open" data-id="${p.id}">
          <span class="mono" style="font-size:12.5px;color:var(--muted)">${nice(p.date)}</span>
          <span class="fx hm" style="gap:8px;min-width:0"><span class="dot" style="background:${c.color}"></span><span class="ell" style="color:var(--muted)">${esc(c.name)}</span></span>
          <span class="ell" style="font-weight:500;color:${isIdea(p) ? 'var(--dim)' : 'var(--text)'}">${esc(title(p))}</span>
          <span class="hm" style="font-size:12.5px;color:var(--muted)">${p.format === 'long' ? 'Full' : 'Short'}</span>
          <span class="fx hm" style="gap:4px">${badges(p)}</span>
          <span>${pill(status(p))}</span></button>`; }).join('')}
    </div>`).join('');
    return `<div style="display:flex;flex-direction:column;gap:20px">
      <div class="fx" style="gap:12px;flex-wrap:wrap"><h1>Posts</h1><div class="f1"></div><input id="search" class="search" placeholder="Search titles and notes" /></div>
      <div class="card" style="overflow:hidden">
        <div class="pgrid phead cap"><span>Date</span><span class="hm">Channel</span><span>Title</span><span class="hm">Format</span><span class="hm">Platforms</span><span>Status</span></div>
        ${groups || '<div style="padding:48px;text-align:center;color:var(--dim)">No posts match these filters.</div>'}
      </div></div>`;
  }

  function viewSettings() {
    const chs = state.channels.map(c => `<div class="card" style="padding:20px;display:flex;flex-direction:column;gap:18px">
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px;align-items:end">
        <label class="slabel">Channel name<input class="sinput" style="font-weight:500" data-set="name" data-c="${c.id}" value="${esc(c.name)}"></label>
        <label class="slabel">Handles / note<input class="sinput" data-set="handles" data-c="${c.id}" value="${esc(c.handles || '')}"></label>
        <div class="slabel">Colour<div class="fx" style="gap:6px;height:38px">${SW.map(col => `<button class="sw ${col.toLowerCase() === (c.color || '').toLowerCase() ? 'on' : ''}" style="background:${col}" data-act="s-color" data-c="${c.id}" data-v="${col}" title="${col}"></button>`).join('')}</div></div>
      </div>
      <div style="display:flex;flex-direction:column;border-top:1px solid var(--line)">
        ${FMTS.map(f => { const on = fmtOn(c, f), F = c.formats[f] || { platforms: [], days: [] };
          return `<div class="sfmt">
            <div class="fx" style="gap:10px;width:170px;flex:none"><button class="tog ${on ? 'on' : ''}" data-act="s-fmt" data-c="${c.id}" data-f="${f}" title="${on ? 'Turn off' : 'Turn on'}"><span></span></button><span style="font-weight:600;font-size:13.5px;white-space:nowrap;color:${on ? 'var(--text)' : 'var(--dim)'}">${f === 'short' ? 'Shorts &amp; Reels' : 'Full length'}</span></div>
            <div class="fx" style="gap:8px;opacity:${on ? 1 : .35}"><span style="font-size:12px;color:var(--dim);width:78px">Posting days</span>
              <div class="fx" style="gap:4px">${['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'].map((l, i) => { const jd = (i + 1) % 7, a = (F.days || []).includes(jd);
                return `<button class="opt day ${a ? 'on' : ''}" data-act="s-day" data-c="${c.id}" data-f="${f}" data-v="${jd}" ${on ? '' : 'disabled'}>${l}</button>`; }).join('')}</div></div>
            <div class="fx" style="gap:8px;opacity:${on ? 1 : .35}"><span style="font-size:12px;color:var(--dim)">Platforms</span>
              <div class="fx" style="gap:4px">${PL.map(k => `<button class="opt pl ${(F.platforms || []).includes(k) ? 'on' : ''}" data-act="s-plat" data-c="${c.id}" data-f="${f}" data-v="${k}" ${on ? '' : 'disabled'}>${PLN[k]}</button>`).join('')}</div></div>
          </div>`; }).join('')}
      </div></div>`).join('');
    return `<div style="display:flex;flex-direction:column;gap:20px;max-width:1080px">
      <div><h1>Settings</h1><p style="margin:6px 0 0;color:var(--muted);font-size:13.5px;text-wrap:pretty">Platforms are what a new post of that format is planned for. Posting days drive <span style="color:var(--text);font-weight:500">Plan 2 weeks</span> — it adds an empty idea slot on each posting day that doesn't already have a post of that format.</p></div>
      ${chs}
      <div class="card" style="padding:20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap">
        <div style="flex:1;min-width:280px"><div style="font-weight:600;font-size:15px">Backup &amp; sync</div>
          <div style="font-size:13px;color:var(--muted);margin-top:4px;text-wrap:pretty">${online ? 'Your calendar syncs to every device you unlock with the passcode. Export a backup now and then.' : 'Opened from a file, so data lives only in this browser. Export a backup, or open the deployed site to sync.'}</div></div>
        <div class="fx" style="gap:8px;flex-wrap:wrap">
          <button class="btn sm" data-act="export">Export JSON</button>
          <label class="btn sm fx" style="cursor:pointer">Import JSON<input type="file" id="importFile" accept="application/json,.json" hidden></label>
          <button class="btn sm" style="border-color:rgba(242,107,107,.35);background:transparent;color:var(--r)" data-act="delete-all">Delete all posts</button>
        </div>
      </div></div>`;
  }

  // ================= drawer =================
  function openDrawer(id) {
    const p = state.items.find(x => x.id === id); if (!p) return;
    ui.openId = id;
    $('#drawerHost').innerHTML = `<div class="scrim" data-act="d-close"></div>
      <aside class="drawer" role="dialog" aria-label="Edit post">
        <div class="dhead"><span id="dPill"></span><span class="mono" id="dDate" style="font-size:12px;color:var(--dim);white-space:nowrap"></span><div class="f1"></div>
          <span class="mono" style="font-size:11px;color:var(--dim);padding:2px 6px;border:1px solid var(--bd);border-radius:5px">Esc</span>
          <button class="x" style="width:30px;height:30px;font-size:18px;color:var(--muted)" data-act="d-close">×</button></div>
        <div class="dbody">
          <input id="dTitle" class="dtitle" placeholder="Untitled idea">
          <div class="dfield"><span class="cap">Channel</span><div class="fx" style="gap:6px;flex-wrap:wrap" id="dCh"></div></div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
            <label class="dfield"><span class="cap">Date</span><input type="date" id="dDateIn" class="dinput"></label>
            <div class="dfield"><span class="cap">Format</span><div class="iseg" style="height:36px" id="dFmt"></div></div>
          </div>
          <div class="dfield"><span class="cap">Platforms</span><div style="border:1px solid var(--line);border-radius:10px;overflow:hidden" id="dPlats"></div></div>
          <label class="dfield"><span class="cap">Link</span><input id="dLink" class="dinput" placeholder="https://…"></label>
          <label class="dfield"><span class="cap">Notes</span><textarea id="dNotes" class="dtext" rows="5" placeholder="Hook, script link, caption, hashtags…"></textarea></label>
        </div>
        <div class="dfoot"><button class="danger" data-act="d-delete">Delete</button><div class="f1"></div>
          <button class="btn sm" style="color:var(--b);height:36px" data-act="d-sched">Schedule all</button>
          <button class="btn primary" style="padding:0 14px;height:36px;font-size:13px" data-act="d-posted">Mark all posted</button></div>
      </aside>`;
    $('#dTitle').value = p.title || ''; $('#dDateIn').value = p.date; $('#dLink').value = p.link || ''; $('#dNotes').value = p.notes || '';
    refreshDrawer();
  }
  function refreshDrawer() {
    const p = state.items.find(x => x.id === ui.openId);
    if (!p) { ui.openId = null; $('#drawerHost').innerHTML = ''; return; }
    if (!$('#dPill')) return;
    $('#dPill').innerHTML = pill(status(p)); $('#dDate').textContent = nice(p.date);
    $('#dCh').innerHTML = state.channels.map(c => `<button class="chopt ${p.channel === c.id ? 'on' : ''}" data-act="d-ch" data-v="${c.id}"><span class="dot" style="background:${c.color}"></span>${esc(c.name)}</button>`).join('');
    $('#dFmt').innerHTML = [['short', 'Short / Reel'], ['long', 'Full length']].map(([f, l]) => `<button class="${p.format === f ? 'on' : ''}" data-act="d-fmt" data-v="${f}">${l}</button>`).join('');
    $('#dPlats').innerHTML = PL.map(k => { const on = has(p, k), st = pst(p, k);
      return `<div class="platrow"><span style="font-size:13.5px;font-weight:500;width:80px;flex:none;color:${on ? 'var(--text)' : 'var(--dim)'}">${PLF[k]}</span>
        ${on ? `<div class="iseg f1">${[['none', 'To schedule'], ['scheduled', 'Scheduled'], ['posted', 'Posted']].map(([s, l]) => `<button style="height:26px;font-size:12px" class="${st === s ? 'on ' + s : ''}" data-act="d-pst" data-k="${k}" data-v="${s}">${l}</button>`).join('')}</div>
          <button class="x" data-act="d-prm" data-k="${k}" title="Not posting on ${PLF[k]}">×</button>`
          : `<button class="addp" data-act="d-padd" data-k="${k}">+ Add</button>`}</div>`; }).join('');
    // pick up edits synced from another device, but never under the cursor
    const set = (sel, v) => { const el = $(sel); if (el && document.activeElement !== el && el.value !== (v || '')) el.value = v || ''; };
    set('#dTitle', p.title); set('#dDateIn', p.date); set('#dLink', p.link); set('#dNotes', p.notes);
  }
  function closeDrawer() {
    const id = ui.openId; ui.openId = null; $('#drawerHost').innerHTML = '';
    const p = state.items.find(x => x.id === id);
    // a brand-new post closed without anything filled in is dropped
    if (p && p._new && isIdea(p) && !p.notes && !p.link) { tombstone(p.id); state.items = state.items.filter(x => x.id !== p.id); save(); }
    render();
  }

  // ================= events =================
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
    const a = b.dataset.act, v = b.dataset.v, id = b.dataset.id;
    const P = ui.openId;
    switch (a) {
      case 'view': ui.view = v; ui.expand = null; saveUI(); render(); window.scrollTo(0, 0); break;
      case 'cf': case 'pf': case 'sf': ui[a] = v; saveUI(); render(); break;
      case 'clear': ui.cf = ui.pf = ui.sf = 'all'; saveUI(); render(); break;
      case 'theme': ui.theme = ui.theme === 'dark' ? 'light' : 'dark'; saveUI(); render(); break;
      case 'plan': plan(); break;
      case 'new': newPost(); break;
      case 'new-at': newPost(b.dataset.d, b.dataset.c); break;
      case 'open': openDrawer(id); break;
      case 'all-sched': setAll(id, 'scheduled'); break;
      case 'all-posted': setAll(id, 'posted'); break;
      case 'kpi-posted': Object.assign(ui, { view: 'posts', sf: 'posted', pf: 'all' }); saveUI(); render(); window.scrollTo(0, 0); break;
      case 'kpi-month': Object.assign(ui, { view: 'month', month: TODAY.slice(0, 7) }); saveUI(); render(); window.scrollTo(0, 0); break;
      case 'kpi-overdue': Object.assign(ui, { view: 'posts', sf: 'all', pf: 'all' }); saveUI(); render(); window.scrollTo(0, 0); break;
      case 'jump': Object.assign(ui, { view: 'posts', cf: b.dataset.c, pf: 'all', sf: b.dataset.s, q: '' }); saveUI(); render(); window.scrollTo(0, 0); break;
      case 'm-prev': case 'm-next': { const [y, m] = ui.month.split('-').map(Number); ui.month = ds(new Date(y, m - 1 + (a === 'm-next' ? 1 : -1), 1)).slice(0, 7); ui.expand = null; render(); break; }
      case 'm-today': ui.month = TODAY.slice(0, 7); render(); break;
      case 'more': ui.expand = ui.expand === b.dataset.d ? null : b.dataset.d; render(); break;
      // drawer
      case 'd-close': closeDrawer(); break;
      case 'd-ch': upd(P, p => {
        p.channel = v; const c = chan(v);
        if (!fmtOn(c, p.format)) p.format = fmtOn(c, 'short') ? 'short' : 'long';
        if (!plats(p).some(k => pst(p, k) !== 'none')) { const defs = c.formats[p.format]?.platforms || []; PL.forEach(k => p.platforms[k] = { planned: defs.includes(k), scheduled: false, posted: false }); }
      }); break;
      case 'd-fmt': upd(P, p => {
        p.format = v; const defs = chan(p.channel).formats[v]?.platforms;
        if (defs && !plats(p).some(k => pst(p, k) !== 'none')) PL.forEach(k => p.platforms[k] = { planned: defs.includes(k), scheduled: false, posted: false });
      }); break;
      case 'd-pst': upd(P, p => setPst(p, b.dataset.k, v)); break;
      case 'd-prm': upd(P, p => { p.platforms[b.dataset.k] = { planned: false, scheduled: false, posted: false }; }); break;
      case 'd-padd': upd(P, p => setPst(p, b.dataset.k, 'none')); break;
      case 'd-sched': setAll(P, 'scheduled'); break;
      case 'd-posted': setAll(P, 'posted'); break;
      case 'd-delete': {
        const p = state.items.find(x => x.id === P);
        if (p && !isIdea(p) && !confirm(`Delete “${p.title}”?`)) break;
        tombstone(P); state.items = state.items.filter(x => x.id !== P); ui.openId = null; $('#drawerHost').innerHTML = ''; save(); render(); toast('Post deleted'); break;
      }
      // settings
      case 's-color': updCh(b.dataset.c, c => c.color = v); break;
      case 's-fmt': updCh(b.dataset.c, c => {
        const f = b.dataset.f;
        if (!c.formats[f]) c.formats[f] = { platforms: ['yt'], days: [] };
        else c.formats[f].off = !c.formats[f].off;
        if (FMTS.every(x => !fmtOn(c, x))) { c.formats[f].off = false; toast('A channel needs at least one format'); }
      }); break;
      case 's-day': updCh(b.dataset.c, c => { const F = c.formats[b.dataset.f]; F.days = F.days || []; const n = +v, i = F.days.indexOf(n); i >= 0 ? F.days.splice(i, 1) : F.days.push(n); }); break;
      case 's-plat': updCh(b.dataset.c, c => { const A = c.formats[b.dataset.f].platforms; const i = A.indexOf(v); if (i >= 0) { if (A.length > 1) A.splice(i, 1); else toast('Keep at least one platform'); } else A.push(v); }); break;
      case 'export': {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
        const el = document.createElement('a'); el.href = URL.createObjectURL(blob); el.download = `content-calendar-${TODAY}.json`; el.click();
        setTimeout(() => URL.revokeObjectURL(el.href), 1000); toast('Backup downloaded'); break;
      }
      case 'delete-all':
        if (!confirm('Delete ALL posts? Channels and settings are kept. Export a backup first if unsure.')) break;
        state.items.forEach(i => tombstone(i.id)); state.items = []; save(); render(); toast('All posts deleted'); break;
    }
  });

  // text fields: drawer saves as you type; settings save on change
  let rt;
  document.addEventListener('input', e => {
    const t = e.target;
    if (t.id === 'search') { ui.q = t.value; const pos = t.selectionStart; render(); const s = $('#search'); s.focus(); s.setSelectionRange(pos, pos); return; }
    const p = state.items.find(x => x.id === ui.openId); if (!p) return;
    const map = { dTitle: 'title', dLink: 'link', dNotes: 'notes' };
    if (map[t.id]) { p[map[t.id]] = t.value; delete p._new; touch(p); save(); clearTimeout(rt); rt = setTimeout(render, 150); }
  });
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.id === 'dDateIn' && t.value) upd(ui.openId, p => p.date = t.value);
    if (t.dataset.set) updCh(t.dataset.c, c => c[t.dataset.set] = t.value);
    if (t.id === 'importFile') importFile(t);
  });
  async function importFile(input) {
    const f = input.files[0]; if (!f) return;
    try {
      const s = JSON.parse(await f.text());
      if (!Array.isArray(s.items) || !Array.isArray(s.channels)) throw new Error('bad file');
      if (!confirm(`Import ${s.items.length} posts? They are merged into what's here; a post with the same id is replaced by the imported copy.`)) { input.value = ''; return; }
      const now = Date.now();
      s.items.forEach(i => { i.updatedAt = now; });
      if (s.channels.length) s.channelsAt = now; else { s.channels = state.channels; s.channelsAt = 0; }
      s.deleted = {};
      s.items.forEach(i => { delete state.deleted[i.id]; });
      state = fixState(merge(state, fixState(s))); save(); render(); toast(`Imported ${s.items.length} posts`);
    } catch (err) { toast('That file is not a content calendar export'); }
    input.value = '';
  }
  document.addEventListener('keydown', e => {
    const tag = (e.target.tagName || '').toUpperCase();
    if (e.key === 'Escape' && ui.openId) { closeDrawer(); return; }
    if ((e.key === 'n' || e.key === 'N') && !['INPUT', 'TEXTAREA', 'SELECT'].includes(tag) && !e.metaKey && !e.ctrlKey && !e.altKey && !$('#lock').classList.contains('open')) { e.preventDefault(); newPost(); }
  });

  // passcode screen
  $('#lockForm').addEventListener('submit', async e => {
    e.preventDefault();
    const v = $('#lockIn').value.trim(); if (!v) return;
    pass = v; $('#lockErr').textContent = 'Checking…';
    try {
      await api('GET');
      try { localStorage.setItem(PASSK, pass); } catch (err) {}
      $('#lock').classList.remove('open'); $('#lockIn').value = '';
      pull();
    } catch (err) {
      pass = '';
      $('#lockErr').textContent = err.code === 401 ? 'Wrong passcode' : (err.message || 'Could not reach the server');
    }
  });

  let toastT;
  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }

  // keep "today" right and pick up changes from other devices
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    if (ds(new Date()) !== TODAY) { TODAY = ds(new Date()); render(); }
    pull();
  });
  setInterval(() => { if (!document.hidden) pull(); }, 60000);

  render();
  if (!online) setSync('local', 'Local only — opened from a file, not syncing');
  else if (!pass) lockOut('');
  else { setSync('saving', 'Syncing…'); pull(); }
})();
</script>
</body>
</html>
